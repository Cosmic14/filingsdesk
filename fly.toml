# Fly.io deployment for the API (see docs/deploy.md).
app = "filingsdesk"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"
  build-target = "api"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[checks.health]
  type = "http"
  port = 8000
  path = "/health"
  interval = "30s"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
