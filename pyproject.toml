[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filingsdesk"
version = "0.1.0"
description = "Market intelligence platform: live prices + SEC filings → Postgres/Redis → FastAPI → vectorised backtesting → RAG Q&A with evals"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "apscheduler>=3.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.22"]
llm = ["anthropic>=1.15,<2"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[project.scripts]
filingsdesk-ingest = "filingsdesk.ingestion.cli:main"
filingsdesk-evals = "filingsdesk.rag.evals:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filingsdesk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends()/Query() in defaults is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a running Postgres (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/filingsdesk"]
omit = [
    "src/filingsdesk/dashboard/*",
    "src/filingsdesk/db/migrations/*",
    "src/filingsdesk/ingestion/scheduler.py",  # blocking APScheduler loop, runtime glue
]

[tool.coverage.report]
show_missing = true
