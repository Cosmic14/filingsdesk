# Two replicas behind one Service. Readiness gates traffic until /health answers;
# liveness restarts a pod that stops answering. The cache may die, the API may not (ADR-0002).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      # Compose's depends_on has no Kubernetes equivalent: wait for Postgres explicitly.
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:pg16
          command: ["sh", "-c", "until pg_isready -h postgres -U filingsdesk; do sleep 2; done"]
      containers:
        - name: api
          image: filingsdesk-api:lab2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: filingsdesk-config}
            - secretRef: {name: filingsdesk-db}
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - port: 8000
